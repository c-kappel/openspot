<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSpot</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { height: 100%; width: 100%; background: #444444; }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = "http://localhost:8000/parking";
    const POLL_MS = 2000;

    const IMG_W = 3420;
    const IMG_H = 1974;

    const map = L.map("map", {
      crs: L.CRS.Simple,
      zoomControl: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      dragging: false,
      keyboard: false,
      minZoom: -4,
    });

    // In L.CRS.Simple, [lat, lng] = [y_from_bottom, x_from_left]
    // Image y goes top-down, so we flip: leaflet_y = IMG_H - image_y
    const imgBounds = [[0, 0], [IMG_H, IMG_W]];
    L.imageOverlay("map.png", imgBounds).addTo(map);
    map.fitBounds(imgBounds);

    function toLeaflet(mx, my) {
      return [IMG_H - my, mx];
    }

    let layers = [];

    function clearLayers() {
      layers.forEach(l => map.removeLayer(l));
      layers = [];
    }

    const DISPLAY_PADDING = 15;
    const SEGMENT_SCALE = 20; // multiplier for segment width so changes are visible
    const ROTATION_DEG = -15;
    const OFFSET_X = 140;
    const OFFSET_Y = -250;
    // Per-spot additional offsets [x, y] indexed by spot key
    const SPOT_OFFSETS = { "0": [10, 110], "1": [55, 25] };

    function rotatePoint(cx, cy, px, py, deg) {
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      return [
        cx + cos * (px - cx) - sin * (py - cy),
        cy + sin * (px - cx) + cos * (py - cy),
      ];
    }

    function drawSegments(data) {
      clearLayers();
      for (const [spotKey, segs] of Object.entries(data)) {
        const [sx, sy] = SPOT_OFFSETS[spotKey] || [0, 0];
        for (const { topLeft, bottomRight } of segs) {
          const segW = (bottomRight[0] - topLeft[0]) * SEGMENT_SCALE;
          const segH = (bottomRight[1] - topLeft[1]) * SEGMENT_SCALE;
          const midX = (topLeft[0] + bottomRight[0]) / 2 + OFFSET_X + sx;
          const midY = (topLeft[1] + bottomRight[1]) / 2 + OFFSET_Y + sy;
          const x1 = midX - segW / 2 - DISPLAY_PADDING;
          const y1 = midY - segH / 2 - DISPLAY_PADDING;
          const x2 = midX + segW / 2 + DISPLAY_PADDING;
          const y2 = midY + segH / 2 + DISPLAY_PADDING;
          const cx = (x1 + x2) / 2;
          const cy = (y1 + y2) / 2;

          const corners = [[x1,y1],[x2,y1],[x2,y2],[x1,y2]].map(([px, py]) => {
            const [rx, ry] = rotatePoint(cx, cy, px, py, ROTATION_DEG);
            return toLeaflet(rx, ry);
          });

          const poly = L.polygon(corners, {
            color: "#00cc44",
            weight: 3,
            fillColor: "#00cc44",
            fillOpacity: 0.4,
            interactive: false,
          }).addTo(map);
          layers.push(poly);
        }
      }
    }

    async function poll() {
      try {
        const res = await fetch(API);
        if (!res.ok) return;
        drawSegments(await res.json());
      } catch (_) {}
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
